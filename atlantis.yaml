version: 3

projects:
  - name: lab-compute-engine
    dir: lab/compute-engine
    workspace: default
    workflow: terragrunt

    autoplan:
      enabled: true
      when_modified:
        - "*.hcl"
        - "*.tf*"
        - "../../modules/**/*.tf*"

workflows:
  terragrunt:
    plan:
      steps:
        - env:
            name: TF_IN_AUTOMATION
            value: "true"
        - run: terragrunt init
        - run: terragrunt plan -input=false -no-color -out=$PLANFILE

    apply:
      steps:
        - run: terragrunt apply -input=false $PLANFILE
