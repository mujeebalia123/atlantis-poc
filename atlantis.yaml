version: 3

projects:
  - name: lab-compute-engine
    dir: lab/compute-engine
    workspace: default
    workflow: terragrunt

    autoplan:
      enabled: true
      when_modified:
        - "**/*.hcl"
        - "../../modules/**/*.tf"

workflows:
  terragrunt:
    plan:
      steps:
        - run: terragrunt init
        - run: terragrunt plan -out=$PLANFILE

    apply:
      steps:
        - run: terragrunt apply $PLANFILE
